name: Pa11y CI 368 expected regression proof

on:
  push:
    branches: [verify/368-failed-page-exit]

permissions:
  contents: read

jobs:
  expected-regressions:
    if: github.repository == 'KyPython/pa11y-ci'
    name: Verify expected regressions against unchanged production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Allow Chrome user namespaces
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Check out verification harness from this workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: verification
          persist-credentials: false
          sparse-checkout: .github/verification/pa11y-368

      - name: Check out immutable tests-only contribution
        uses: actions/checkout@v7
        with:
          ref: 3e89973d424c789ea9bb08bc0039318c28e5d647
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - run: npm ci
        working-directory: source

      - name: Identify the locked Puppeteer browser
        working-directory: source
        run: node -e "console.log(require('puppeteer').executablePath())"

      - name: Require exact expected failures and unchanged production
        run: node verification/.github/verification/pa11y-368/verify-red.cjs source verification/.github/verification/pa11y-368/red-contract.json evidence

      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pa11y-368-expected-regressions-3e89973d424c789ea9bb08bc0039318c28e5d647
          path: evidence/
          if-no-files-found: error
